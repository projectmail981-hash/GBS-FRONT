<div class="reports-page">
  <header class="reports-header">
    <button class="back-btn" routerLink="/more-options" aria-label="Back">&#8592;</button>
    <h2>Reports &amp; Analytics</h2>
  </header>

  <div class="customer-count-card">
    <div class="card-icon">&#128101;</div>
    <div class="card-content">
      <p>Today's Unique Customers</p>
      <h3>{{ todayCustomerCount }}</h3>
    </div>
  </div>

  <div class="filters-section">
    <h3>Filter Reports</h3>
    <div class="date-filters">
      <div class="form-group">
        <label>From Date</label>
        <input type="date" [(ngModel)]="fromDate" (change)="applyDateFilter()">
      </div>
      <div class="form-group">
        <label>To Date</label>
        <input type="date" [(ngModel)]="toDate" (change)="applyDateFilter()">
      </div>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="card-title">Income</div>
      <div class="card-value">&#8377;{{ filteredIncome }}</div>
    </div>
    <div class="metric-card">
      <div class="card-title">Profit From Parts</div>
      <div class="card-value">&#8377;{{ filteredPartsProfit }}</div>
    </div>
    <div class="metric-card">
      <div class="card-title">Labour Charge</div>
      <div class="card-value">&#8377;{{ filteredLabourCharge }}</div>
    </div>
  </div>

  <div class="charts-section">
    <h3>Orders Analysis (Job Status)</h3>
    <div class="charts-grid">
      <div class="chart-container">
        <canvas #todayChartCanvas></canvas>
      </div>
      <div class="chart-container">
        <canvas #weekChartCanvas></canvas>
      </div>
      <div class="chart-container">
        <canvas #monthChartCanvas></canvas>
      </div>
    </div>
  </div>
</div>
